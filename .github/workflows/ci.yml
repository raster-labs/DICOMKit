name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SWIFT_VERSION: '6.4'

jobs:
  test-macos:
    name: Test on macOS 26 (Swift 6.4)
    runs-on: macos-26-intel
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Swift 6.4 on macOS 26
      id: apple_toolchain
      run: bash .github/scripts/setup-stable-swift.sh

    # Fail on an unusable Vision model before compiling the package.
    - name: Check hosted Vision runtime
      timeout-minutes: 5
      run: |
        xcrun swiftc -parse-as-library -target "$(uname -m)-apple-macosx15.0" \
          .github/scripts/check-hosted-ocr.swift -o "$RUNNER_TEMP/check-hosted-ocr"
        "$RUNNER_TEMP/check-hosted-ocr"
      
    - name: Show Swift version
      run: swift --version
      
    - name: Restore Swift Package Manager cache
      id: spm_cache
      uses: actions/cache/restore@v4
      with:
        path: |
          .build
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ steps.apple_toolchain.outputs.cache-prefix }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ steps.apple_toolchain.outputs.source-sha }}
        restore-keys: |
          ${{ steps.apple_toolchain.outputs.cache-prefix }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-

    # DICOM_TAG_ATTRIBUTE_AUDIT_PLAN.md Phase 5: every hand-written tag must agree
    # with the PS3.6 dictionary it sits next to. Fails on any BLOCKER/MAJOR.
    - name: Audit DICOM tags against PS3.6
      run: python3 Scripts/audit_tags.py . --strict

    # Prepare each test configuration before its timed execution steps. Release
    # products also supply the real split/merge binaries used by workshop tests.
    # --skip-build is safe only after the matching build of this checkout.
    - name: Build release package
      id: release_build
      run: swift build -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays -c release

    # Discovery uses the same testability settings as the execution command.
    - name: Build and discover optimized tests
      run: swift test -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays -c release list > release-test-discovery.log

    - name: Run optimized source-envelope tests
      timeout-minutes: 30
      run: swift test -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays -c release --skip-build --filter largeSparseSource

    - name: Build and discover debug tests
      run: swift test -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays list > debug-test-discovery.log

    # Vision and network XCTest cases share host services. Keep the local/release
    # process model, without spawning one XCTest process per method.
    - name: Check hosted OCR service
      timeout-minutes: 30
      run: swift test -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays --skip-build --filter TextRegionDetectorTests

    - name: Run tests
      timeout-minutes: 30
      run: swift test -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays --skip-build --skip largeSparseSource

    # GPU_RENDERING_PLAN.md M7: the CPU backend remains independently usable.
    - name: Run render tests with Metal forced off
      env:
        DICOMKIT_RENDER_BACKEND: cpu
      run: swift test -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays --skip-build --filter 'DICOMRenderKitTests|WindowLUTParityTests|ExportWindowParityTests'

    # Preserve valid build products after a test failure; every later run still
    # executes the complete build and test gates against its checked-out source.
    - name: Save Swift Package Manager cache
      if: ${{ always() && !cancelled() && steps.release_build.outcome == 'success' && steps.spm_cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: |
          .build
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ steps.spm_cache.outputs.cache-primary-key }}

  build-documentation:
    name: Build Documentation
    runs-on: xcode-27
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode
      run: bash .github/scripts/select-swift-toolchain.sh
      
    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-docs-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-docs-
    
    - name: Build DocC documentation
      run: |
        # Build documentation for all modules
        swift package --allow-writing-to-directory ./docs \
          generate-documentation --target DICOMKit \
          --disable-indexing \
          --transform-for-static-hosting \
          --hosting-base-path DICOMKit \
          --output-path ./docs
      continue-on-error: true
      
  code-quality:
    name: Code Quality Checks
    runs-on: xcode-27
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode
      run: bash .github/scripts/select-swift-toolchain.sh
      
    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-quality-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-quality-
          ${{ runner.os }}-spm-
      
    - name: Check for compiler warnings
      run: |
        swift build 2>&1 | tee build.log
        if grep -i "warning:" build.log; then
          echo "::warning::Compiler warnings detected"
          # Don't fail the build, just warn
        fi
        
    - name: Validate Package.swift
      run: swift package dump-package > /dev/null
      
    - name: Check formatting (if swift-format is available)
      run: |
        if command -v swift-format &> /dev/null; then
          swift-format lint -r Sources Tests
        else
          echo "swift-format not found, skipping"
        fi
      continue-on-error: true
      
  validate-platforms:
    name: Validate Platform Support
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            scheme: DICOMKit
            destination: 'generic/platform=iOS Simulator'
          - platform: macOS
            scheme: DICOMKit-Package
            destination: 'platform=macOS'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode
      run: bash .github/scripts/select-swift-toolchain.sh
      
    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-platform-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-platform-
          ${{ runner.os }}-spm-
      
    - name: List available destinations
      run: xcodebuild -showdestinations -scheme '${{ matrix.scheme }}'
      
    - name: Build for ${{ matrix.destination }}
      run: |
        xcodebuild clean build \
          -scheme '${{ matrix.scheme }}' \
          -destination '${{ matrix.destination }}' \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          CODE_SIGNING_ALLOWED=NO
      
  security-scan:
    name: Security Scan
    runs-on: xcode-27
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run dependency audit
      run: |
        # Check for known vulnerabilities in dependencies
        swift package show-dependencies --format json > dependencies.json
        echo "Dependencies scanned, no automated vulnerability check available yet"
      continue-on-error: true
      
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test-macos, build-documentation, code-quality, validate-platforms, security-scan]
    if: always()
    
    steps:
    - name: Check overall status
      run: |
        if [ "${{ needs.test-macos.result }}" != "success" ]; then
          echo "::error::macOS tests failed"
          exit 1
        fi
        if [ "${{ needs.code-quality.result }}" != "success" ]; then
          echo "::warning::Code quality checks had issues"
        fi
        if [ "${{ needs.validate-platforms.result }}" != "success" ]; then
          echo "::error::iOS or macOS platform validation failed"
          exit 1
        fi
        if [ "${{ needs.security-scan.result }}" != "success" ]; then
          echo "::warning::Security scan had issues"
        fi
        echo "✅ CI pipeline completed successfully"
