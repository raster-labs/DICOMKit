name: Hosted Vision Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vision-diagnostic:
    name: Inspect hosted Vision OCR
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: bash .github/scripts/select-swift-toolchain.sh
      - name: Compile diagnostic
        run: xcrun swiftc -parse-as-library -target arm64-apple-macosx15.0 .github/scripts/vision-ocr-diagnostic.swift -o "$RUNNER_TEMP/vision-ocr-diagnostic"
      - name: Inspect Vision model and errors
        run: '"$RUNNER_TEMP/vision-ocr-diagnostic"'
