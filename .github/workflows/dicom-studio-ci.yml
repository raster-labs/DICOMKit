name: DICOM Studio CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Sources/DICOMStudio/**'
      - 'Tests/DICOMStudioTests/**'
      - 'Package.swift'
      - '.github/workflows/dicom-studio-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Sources/DICOMStudio/**'
      - 'Tests/DICOMStudioTests/**'
      - 'Package.swift'
      - '.github/workflows/dicom-studio-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SWIFT_VERSION: '6.4'

jobs:
  build-and-test:
    name: Build & Test DICOMStudio
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
            xcode: '27.0'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode (macOS)
      run: bash .github/scripts/select-swift-toolchain.sh "${{ matrix.xcode }}"

    - name: Show Swift version
      run: swift --version

    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: |
          .build
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-studio-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-studio-spm-

    - name: Build DICOMStudio
      run: swift build -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays --target DICOMStudio -v

    # SplitMergeWorkshopCLIParityTests and AnonWorkshopCLIParityTests compare against actual CLI tools.
    - name: Build CLI parity prerequisites
      run: |
        swift build -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays --product dicom-anon
        swift build -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays -c release --product dicom-split
        swift build -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays -c release --product dicom-merge

    - name: Run DICOMStudio Tests
      run: swift test -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays --test-product DICOMStudioTests -v

    - name: Build DICOMStudio (Release)
      run: swift build -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays --target DICOMStudio -c release

  test-coverage:
    name: Test Coverage Report
    runs-on: xcode-27
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode
      run: bash .github/scripts/select-swift-toolchain.sh

    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: |
          .build
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-studio-coverage-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-studio-coverage-

    # SplitMergeWorkshopCLIParityTests and AnonWorkshopCLIParityTests compare against actual CLI tools.
    - name: Build CLI parity prerequisites
      run: |
        swift build -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays --product dicom-anon
        swift build -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays -c release --product dicom-split
        swift build -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays -c release --product dicom-merge

    - name: Run Tests with Coverage
      run: |
        swift test -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays \
          --test-product DICOMStudioTests \
          --enable-code-coverage \
          -v

    - name: Generate Coverage Report
      run: |
        BIN_PATH=$(swift build -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays --show-bin-path)
        PROFDATA=$(find .build -name "default.profdata" -type f | head -1)
        
        if [ -z "$PROFDATA" ]; then
          echo "::warning::No profdata file found"
          exit 0
        fi
        
        # Find the test binary
        TEST_BIN=$(find .build -path "*/DICOMStudioTests.xctest/Contents/MacOS/DICOMStudioTests" -type f | head -1)
        if [ -z "$TEST_BIN" ]; then
          TEST_BIN=$(find .build -name "DICOMKitPackageTests" -type f | head -1)
        fi
        if [ -z "$TEST_BIN" ]; then
          TEST_BIN=$(find .build -name "*.xctest" -type d | head -1)
        fi
        
        if [ -z "$TEST_BIN" ]; then
          echo "::warning::No test binary found"
          exit 0
        fi
        
        echo "## DICOMStudio Test Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Generate line-by-line coverage for DICOMStudio sources
        xcrun llvm-cov report "$TEST_BIN" \
          -instr-profile="$PROFDATA" \
          -ignore-filename-regex='Tests/|\.build/|Views/|App/' \
          Sources/DICOMStudio/ 2>/dev/null || echo "Coverage report generation completed"
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ DICOMStudio tests completed successfully" >> $GITHUB_STEP_SUMMARY

  summary:
    name: DICOMStudio CI Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, test-coverage]
    if: always()

    steps:
    - name: Check status
      run: |
        if [ "${{ needs.build-and-test.result }}" != "success" ]; then
          echo "::error::DICOMStudio build or tests failed"
          exit 1
        fi
        echo "✅ DICOMStudio CI pipeline completed successfully"
