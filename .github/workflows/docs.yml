name: Documentation

on:
  push:
    branches: [ main, codex/dicom-2026a-milestones ]
    paths:
      - 'Sources/**'
      - 'Documentation/**'
      - '**.md'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Scripts/build_docc_docs.py'
      - 'Scripts/test_build_docc_docs.py'
      - '.github/workflows/docs.yml'
      - '.github/scripts/select-swift-toolchain.sh'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build Documentation
    runs-on: xcode-27
    permissions:
      contents: read
      pages: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode
      run: bash .github/scripts/select-swift-toolchain.sh

    - name: Verify main Pages configuration
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if ! gh api "repos/${GITHUB_REPOSITORY}/pages" > pages-config.json; then
          echo "::error::GitHub Pages is not accessible. A repository administrator must enable Settings > Pages > Source: GitHub Actions before main can deploy. This workflow does not enable or change repository Pages settings."
          exit 1
        fi
        python3 - <<'PY'
        import json
        config = json.load(open("pages-config.json"))
        if config.get("build_type") != "workflow":
            raise SystemExit("GitHub Pages must use Source: GitHub Actions (build_type=workflow).")
        PY

    - name: Read main Pages hosting configuration
      id: pages
      if: github.ref == 'refs/heads/main'
      uses: actions/configure-pages@v5
      with:
        enablement: false

    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-docs-${{ hashFiles('**/Package.resolved', 'Scripts/build_docc_docs.py') }}
        restore-keys: |
          ${{ runner.os }}-spm-docs-

    - name: Verify documentation failure controls
      run: python3 -m unittest discover -s Scripts -p test_build_docc_docs.py -v

    - name: Build and validate all DocC modules
      env:
        PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      run: |
        args=(--output-path docs)
        if [[ "$GITHUB_REF" == refs/heads/main ]]; then
          args+=(--hosting-base-path "$PAGES_BASE_PATH")
        fi
        python3 Scripts/build_docc_docs.py "${args[@]}"

    - name: Upload validated documentation for review
      uses: actions/upload-artifact@v4
      with:
        name: documentation-${{ github.sha }}
        path: docs
        if-no-files-found: error

    - name: Upload main Pages artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
