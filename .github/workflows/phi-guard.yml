name: PHI Guard

# No DICOM payloads, including synthetic/de-identified fixtures, may be committed.
# Tests generate their inputs in temporary directories. Inspect archive contents
# as well as filenames and signatures; a clean header cannot prove clean pixels.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scan:
    name: Reject committed DICOM payloads
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify DICOM guard controls
        run: python3 -m unittest discover -s Scripts -p test_check_no_dicom.py -v

      - name: Reject committed DICOM files and archived payloads
        run: python3 Scripts/check_no_dicom.py .
