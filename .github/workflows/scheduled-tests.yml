name: Scheduled Tests

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      comprehensive_only:
        description: 'Verify only the comprehensive suite and its prerequisites'
        required: false
        type: boolean
        default: false

env:
  SWIFT_VERSION: '6.4'

jobs:
  comprehensive-test:
    name: Comprehensive Test Suite
    runs-on: macos-26-intel
    timeout-minutes: 180
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify report failure controls
      run: python3 -m unittest discover -s .github/scripts -p test_report_scheduled_tests.py -v
      
    - name: Set up Swift 6.4 on macOS 26
      id: apple_toolchain
      run: bash .github/scripts/setup-stable-swift.sh

    - name: Check hosted Vision runtime
      timeout-minutes: 5
      run: |
        set -o pipefail
        mkdir -p scheduled-test-logs
        xcrun swiftc -parse-as-library -target "$(uname -m)-apple-macosx15.0" \
          .github/scripts/check-hosted-ocr.swift -o "$RUNNER_TEMP/check-hosted-ocr"
        "$RUNNER_TEMP/check-hosted-ocr" 2>&1 | tee scheduled-test-logs/ocr-preflight.log
      
    - name: Show environment
      run: |
        swift --version
        xcodebuild -version
        
    - name: Cache Swift Package Manager
      id: spm_cache
      uses: actions/cache/restore@v4
      with:
        path: .build
        key: ${{ steps.apple_toolchain.outputs.cache-prefix }}-scheduled-coverage-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ steps.apple_toolchain.outputs.source-sha }}
        restore-keys: |
          ${{ steps.apple_toolchain.outputs.cache-prefix }}-scheduled-coverage-${{ hashFiles('Package.swift', 'Package.resolved') }}-

    # Run 40300110331 built successfully but lacked release CLIs and a working
    # Vision runtime. Its parallel run also saw two unproven ARTIM timeouts.
    # Prepare real binaries and retain one serial coverage execution, rather
    # than rerunning the entire suite to generate a report.
    - name: Build release CLI tools
      run: |
        set -o pipefail
        swift build -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays -c release \
          2>&1 | tee scheduled-test-logs/release-build.log
        bin_dir="$(swift build -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays -c release --show-bin-path)"
        test -x "$bin_dir/dicom-split"
        test -x "$bin_dir/dicom-merge"
        test -x "$bin_dir/dicom-anon"
        echo "DICOMKIT_TEST_BIN_DIR=$bin_dir" >> "$GITHUB_ENV"
        printf '%s\n' "$bin_dir" > scheduled-test-logs/cli-bin-dir.txt
        shasum -a 256 "$bin_dir/dicom-split" "$bin_dir/dicom-merge" "$bin_dir/dicom-anon" \
          > scheduled-test-logs/cli-sha256.txt

    - name: Build and discover optimized source-envelope tests
      run: |
        set -o pipefail
        swift test -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays \
          -c release --test-product DICOMKitTests list \
          2>&1 | tee scheduled-test-logs/release-test-discovery.log

    - name: Run optimized source-envelope tests
      id: release_tests
      timeout-minutes: 30
      run: |
        set -o pipefail
        swift test -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays \
          -c release --test-product DICOMKitTests --skip-build --filter largeSparseSource \
          2>&1 | tee scheduled-test-logs/release-source-envelope.log

    - name: Build and discover Debug tests with coverage
      id: debug_build
      run: |
        set -o pipefail
        # Discovery-only preparation left coverage unavailable in Swift 6.4.
        # Build instrumented tests explicitly before discovery.
        swift build -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays \
          --build-tests --enable-code-coverage 2>&1 | tee scheduled-test-logs/debug-test-build.log
        swift test -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays \
          list --skip-build 2>&1 | tee scheduled-test-logs/debug-test-discovery.log
        debug_bin_dir="$(swift build -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays --show-bin-path)"
        case "$debug_bin_dir" in
          "$GITHUB_WORKSPACE"/.build/*) ;;
          *) echo '::error::Unexpected coverage output path'; exit 1 ;;
        esac
        # Cached profiles must never stand in for this execution's evidence.
        rm -rf -- "$debug_bin_dir/codecov"
        echo "DICOMKIT_COVERAGE_DIR=$debug_bin_dir/codecov" >> "$GITHUB_ENV"

    # The source-envelope test is executed above in Release, as in ci.yml.
    # Keep the full remaining Debug suite. Vision/network XCTest fixtures share
    # host services, so do not spawn a new process for every XCTest method.
    - name: Run complete Debug suite with coverage
      id: debug_tests
      timeout-minutes: 45
      run: |
        set -o pipefail
        swift test -Xswiftc -Xfrontend -Xswiftc -enable-cross-import-overlays \
          --enable-code-coverage --skip-build --no-parallel --skip largeSparseSource \
          2>&1 | tee scheduled-test-logs/debug-suite.log

    - name: Generate report and require executed tests and coverage
      if: always()
      run: |
        python3 .github/scripts/report-scheduled-tests.py scheduled-test-logs \
          --release-outcome '${{ steps.release_tests.outcome }}' \
          --debug-outcome '${{ steps.debug_tests.outcome }}' \
          --coverage-dir "${DICOMKIT_COVERAGE_DIR:-.build/unavailable-codecov}" \
          --summary "$GITHUB_STEP_SUMMARY"

    # Preserve a successfully prepared build even if execution/reporting fails.
    # A restored build is rebuilt at the checked-out source; profiles are reset.
    - name: Save prepared Swift build cache
      if: ${{ always() && !cancelled() && steps.debug_build.outcome == 'success' && steps.spm_cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: .build
        key: ${{ steps.spm_cache.outputs.cache-primary-key }}

    - name: Preserve test logs and coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: scheduled-comprehensive-${{ github.sha }}-${{ github.run_attempt }}
        path: |
          scheduled-test-logs/
          .build/**/codecov/
        include-hidden-files: true
        if-no-files-found: error

  memory-leak-check:
    name: Memory Leak Detection
    if: ${{ !inputs.comprehensive_only }}
    runs-on: xcode-27
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode
      run: bash .github/scripts/select-swift-toolchain.sh
      
    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-sanitize-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-sanitize-
          ${{ runner.os }}-spm-
      
    - name: Build with sanitizers
      run: |
        # Build with Address Sanitizer to detect memory issues
        swift build -c release -Xswiftc -sanitize=address
      continue-on-error: true
      
    - name: Run tests with sanitizers
      run: |
        swift test -Xswiftc -sanitize=address
      continue-on-error: true
      
  performance-benchmark:
    name: Performance Benchmarks
    if: ${{ !inputs.comprehensive_only }}
    runs-on: xcode-27
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode
      run: bash .github/scripts/select-swift-toolchain.sh
      
    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-perf-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-perf-
          ${{ runner.os }}-spm-
      
    - name: Build in release mode
      run: swift build -c release
      
    - name: Run performance tests
      run: |
        # Run tests with timing information
        swift test -c release --filter PerformanceTests || echo "No dedicated performance tests found"
        
  dependency-update-check:
    name: Check for Dependency Updates
    if: ${{ !inputs.comprehensive_only }}
    runs-on: xcode-27
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode
      run: bash .github/scripts/select-swift-toolchain.sh
      
    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-deps-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-deps-
          ${{ runner.os }}-spm-
      
    - name: Update dependencies
      run: swift package update
      
    - name: Check if dependencies changed
      run: |
        if git diff --quiet Package.resolved; then
          echo "✅ Dependencies are up to date"
        else
          echo "::warning::Dependencies have updates available"
          git diff Package.resolved
        fi
        
  build-matrix:
    name: Build Matrix Test
    if: ${{ !inputs.comprehensive_only }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        config: ['debug', 'release']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode
      run: bash .github/scripts/select-swift-toolchain.sh
      
    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-matrix-${{ matrix.config }}-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-matrix-${{ matrix.config }}-
          ${{ runner.os }}-spm-
      
    - name: Build in ${{ matrix.config }} mode
      run: swift build -c ${{ matrix.config }}
      continue-on-error: true
      
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [comprehensive-test, memory-leak-check, performance-benchmark, dependency-update-check, build-matrix]
    if: always()
    
    steps:
    - name: Generate summary
      run: |
        echo "## Scheduled Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Comprehensive Tests: ${{ needs.comprehensive-test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Memory Leak Check: ${{ needs.memory-leak-check.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Performance Benchmarks: ${{ needs.performance-benchmark.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Dependency Update Check: ${{ needs.dependency-update-check.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Build Matrix: ${{ needs.build-matrix.result }}" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.comprehensive-test.result }}" != "success" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Warning**: Some tests failed" >> $GITHUB_STEP_SUMMARY
        fi
