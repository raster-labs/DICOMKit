name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
      build_documentation:
        description: 'Also attempt the optional DocC archive'
        type: boolean
        default: false
      validated_ci_run:
        description: 'Optional successful focused PR CI run for the identical validation tree'
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SWIFT_VERSION: '6.4'

jobs:
  validate-release:
    name: Validate Release on macOS 26 (Swift 6.4)
    runs-on: macos-26-intel
    permissions:
      contents: read
      actions: read
    timeout-minutes: 90

    steps:
    - name: Checkout validation and workflow revision
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}

    # A manual release repair may change tests/workflows after a tag exists.
    # The product still comes from that tag; reject any production-input drift.
    - name: Bind validation to tagged production inputs
      env:
        RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      run: |
        python3 .github/scripts/verify-release-inputs.py --tag "$RELEASE_TAG" \
          --output "$RUNNER_TEMP/release-validation.json"

    - name: Reuse completed focused CI for identical inputs
      id: reuse_ci
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.validated_ci_run != '' }}
      env:
        GH_TOKEN: ${{ github.token }}
        VALIDATED_CI_RUN: ${{ inputs.validated_ci_run }}
      run: |
        python3 .github/scripts/reuse-focused-ci.py --run "$VALIDATED_CI_RUN" \
          --validation "$RUNNER_TEMP/release-validation.json"

    - name: Set up Swift 6.4 on macOS 26
      if: ${{ steps.reuse_ci.outputs.reuse != 'true' }}
      id: apple_toolchain
      run: bash .github/scripts/setup-stable-swift.sh

    - name: Restore Swift Package Manager cache
      if: ${{ steps.reuse_ci.outputs.reuse != 'true' }}
      id: spm_cache
      uses: actions/cache/restore@v4
      with:
        path: |
          .build
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ steps.apple_toolchain.outputs.cache-prefix }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ steps.apple_toolchain.outputs.source-sha }}
        restore-keys: |
          ${{ steps.apple_toolchain.outputs.cache-prefix }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-

    - name: Build focused test products
      if: ${{ steps.reuse_ci.outputs.reuse != 'true' }}
      id: focused_build
      run: bash .github/scripts/run-focused-tests.sh build

    - name: Run focused release regressions
      if: ${{ steps.reuse_ci.outputs.reuse != 'true' }}
      timeout-minutes: 30
      env:
        CI: 'true'
      run: bash .github/scripts/run-focused-tests.sh run

    - name: Preserve focused release test logs
      if: ${{ always() && steps.reuse_ci.outputs.reuse != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: focused-test-logs
        path: .build/ci-logs/focused-${{ github.run_id }}-${{ github.run_attempt }}/
        if-no-files-found: warn

    # CLI batches below compile optimized production binaries with warnings as
    # errors. Avoid a duplicate Intel release build and full Debug suite here.
    - name: Save Swift Package Manager cache
      if: ${{ always() && !cancelled() && steps.reuse_ci.outputs.reuse != 'true' && steps.focused_build.outcome == 'success' && steps.spm_cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: |
          .build
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ steps.spm_cache.outputs.cache-primary-key }}

    - name: Upload release validation identity
      uses: actions/upload-artifact@v4
      with:
        name: release-validation
        path: ${{ runner.temp }}/release-validation.json
        if-no-files-found: error

  build-cli-tools:
    name: Build CLI Tools (Batch ${{ matrix.batch }})
    runs-on: xcode-27
    needs: validate-release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: "1"
            tools: "dicom-info dicom-convert dicom-validate dicom-anon dicom-dump dicom-query dicom-send dicom-diff dicom-retrieve dicom-split"
          - batch: "2"
            tools: "dicom-merge dicom-json dicom-xml dicom-pdf dicom-image dicom-dcmdir dicom-archive dicom-export dicom-qr dicom-wado"
          - batch: "3"
            tools: "dicom-echo dicom-mwl dicom-mpps dicom-pixedit dicom-tags dicom-uid dicom-compress dicom-study dicom-script"
          - batch: "4"
            tools: "dicom-report dicom-measure dicom-viewer dicom-3d dicom-jpip dicom-j2k dicom-gateway"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      
    - name: Select Xcode
      run: bash .github/scripts/select-swift-toolchain.sh
      
    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-release-batch${{ matrix.batch }}-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-release-batch${{ matrix.batch }}-
          ${{ runner.os }}-spm-release-
          
    - name: Build CLI tools (Batch ${{ matrix.batch }})
      run: |
        for tool in ${{ matrix.tools }}; do
          echo "Building $tool..."
          swift build -c release --product $tool -Xswiftc -warnings-as-errors
        done
        
    - name: Stage CLI binaries
      run: |
        # The CLI dependency graphs do not build the copy-only renderer bundle.
        # One batch must build its owning target before archive assembly.
        RESOURCE_OPTIONS=(--exclude-renderer)
        if [[ "${{ matrix.batch }}" == "4" ]]; then
          swift build -c release --target DICOMRenderKit -Xswiftc -warnings-as-errors
          RESOURCE_OPTIONS=()
        fi
        PRODUCTS=$(swift build -c release --show-bin-path)
        python3 Scripts/package_release_cli.py stage --products "$PRODUCTS" \
          --archive staged-cli.tar --tools ${{ matrix.tools }} "${RESOURCE_OPTIONS[@]}"
        
    - name: Upload CLI binaries artifact
      uses: actions/upload-artifact@v4
      with:
        name: cli-binaries-batch-${{ matrix.batch }}
        path: staged-cli.tar
        
  build-documentation:
    name: Build and Deploy Documentation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_documentation }}
    runs-on: xcode-27
    needs: validate-release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      
    - name: Select Xcode
      run: bash .github/scripts/select-swift-toolchain.sh
      
    - name: Build and validate all DocC modules
      run: python3 Scripts/build_docc_docs.py --output-path docs
          
    - name: Create documentation archive
      run: |
        cd docs
        tar -czf ../dicomkit-docs.tar.gz *
        
    - name: Upload documentation artifact
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: dicomkit-docs.tar.gz
        
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-cli-tools, build-documentation]
    # DocC is optional and opt-in; CLI archives and provenance are required.
    if: ${{ !cancelled() && needs.build-cli-tools.result == 'success' }}
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
        
    - name: Get tag name
      id: get_tag
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
        else
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi
        
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: Validate CLI packaging contract
      run: python3 Scripts/test_package_release_cli.py

    - name: Combine CLI tools into single archive
      run: |
        python3 Scripts/package_release_cli.py assemble --artifacts artifacts \
          --archive dicomkit-cli-tools-${{ steps.get_tag.outputs.tag }}-macos-arm64.tar.gz \
          > cli-archive-inventory.json

    - name: Bind release artifact provenance
      run: |
        python3 Scripts/create_release_provenance.py --tag "${{ steps.get_tag.outputs.tag }}" \
          --archive dicomkit-cli-tools-${{ steps.get_tag.outputs.tag }}-macos-arm64.tar.gz \
          --inventory cli-archive-inventory.json --output release-provenance.json
        python3 - <<'PYPROVENANCE'
        import json, os
        from pathlib import Path
        path = Path('release-provenance.json')
        receipt = json.loads(path.read_text())
        validation = json.loads(Path('artifacts/release-validation/release-validation.json').read_text())
        assert validation['tag'] == receipt['tag']
        assert validation['sourceCommit'] == receipt['commit']
        assert validation['sourceTree'] == receipt['tree']
        assert validation['validationCommit'] == os.environ['WORKFLOW_COMMIT']
        assert validation['productionInputsUnchanged'] is True
        receipt['validation'] = validation
        receipt['workflowCommit'] = os.environ['WORKFLOW_COMMIT']
        receipt['workflowEvent'] = os.environ['WORKFLOW_EVENT']
        path.write_text(json.dumps(receipt, indent=2) + '\n')
        PYPROVENANCE
      env:
        WORKFLOW_COMMIT: ${{ github.sha }}
        WORKFLOW_EVENT: ${{ github.event_name }}
        
    - name: Generate release notes
      id: release_notes
      run: |
        # Extract version from tag (remove 'v' prefix)
        VERSION=${TAG#v}
        
        # Try to find release notes in CHANGELOG.md or RELEASE_NOTES
        if [ -f "RELEASE_NOTES_$TAG.md" ]; then
          cat "RELEASE_NOTES_$TAG.md" > release_notes.md
        elif [ -f "CHANGELOG.md" ]; then
          # Extract section for this version from CHANGELOG
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md
        else
          echo "Release $TAG" > release_notes.md
          echo "" >> release_notes.md
          echo "## Changes" >> release_notes.md
          git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> release_notes.md
        fi
      env:
        TAG: ${{ steps.get_tag.outputs.tag }}
        
    - name: Create draft GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_tag.outputs.tag }}
        name: DICOMKit ${{ steps.get_tag.outputs.tag }}
        body_path: release_notes.md
        draft: true
        prerelease: ${{ contains(steps.get_tag.outputs.tag, '-') }}
        files: |
          dicomkit-cli-tools-*.tar.gz
          cli-archive-inventory.json
          release-provenance.json
          artifacts/documentation/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish immutable GitHub Release
      run: gh release edit "${{ steps.get_tag.outputs.tag }}" --draft=false --latest
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
  notify-success:
    name: Notify Release Success
    runs-on: ubuntu-latest
    needs: create-release
    if: success()
    
    steps:
    - name: Success notification
      run: |
        echo "✅ Release created successfully!"
        echo "Tag: ${{ needs.create-release.outputs.tag || github.ref_name }}"
